<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: iOSでノッチ端末のセーフエリア(env(safe-area-inset-*))を有効化＝上部/側部の見切れ防止(#14) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- 更新時の白画面対策（保険）：ブラウザに index.html をキャッシュさせず、毎回ハッシュ付きJSの最新名を取得させる。
         仕様上ブラウザが http-equiv を無視できる場合もあるため、サーバ側Cache-Control（Cloudflare）と併用。 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>高校サッカー部｜ただタダ games</title>
    <meta name="description" content="創部から全国制覇を目指す、育成×経営の高校サッカー部・監督シミュレーション。ブラウザで無料、すぐに遊べます。" />
    <meta name="theme-color" content="#fbf2e3" />
    <!-- 公開URLは /games/football/ で確定（Worker配信・ADR-023 ワンオリジン構成）。
         itch.io等へ別配布した場合の重複コンテンツ誤認を防ぐため canonical を固定する。 -->
    <link rel="canonical" href="https://tadatada.net/games/football/" />
    <!-- OGP: セクション別4枚方式（tools/quiz/games/default）に準拠＝games面は ogp-games.jpg を共用 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ただただ" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:url" content="https://tadatada.net/games/football/" />
    <meta property="og:title" content="高校サッカー部｜ただタダ games" />
    <meta property="og:description" content="創部から全国制覇を目指す、育成×経営の高校サッカー部・監督シミュレーション。ブラウザで無料、すぐに遊べます。" />
    <meta property="og:image" content="https://tadatada.net/assets/ogp-games.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ただタダgames." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="高校サッカー部｜ただタダ games" />
    <meta name="twitter:description" content="創部から全国制覇を目指す、育成×経営の高校サッカー部・監督シミュレーション。ブラウザで無料、すぐに遊べます。" />
    <meta name="twitter:image" content="https://tadatada.net/assets/ogp-games.jpg" />
    <!-- iOS全画面対応(#14): Fullscreen APIは非対応のため、「ホーム画面に追加」で standalone 起動＝全画面化する。 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="高校サッカー部" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&family=Quicksand:wght@500;700&display=swap" rel="stylesheet" />
    <!-- F2: 序盤に確実に表示される重要画像をプリロード（回線が弱くてもタイトル/マスコットの遅延を抑える） -->
    <link rel="preload" as="image" href="./title-logo.webp" />
    <link rel="preload" as="image" href="./bg/title.webp" />
    <link rel="preload" as="image" href="./mascot/coach.webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
